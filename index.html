                                        <i className="fas fa-subway mr-2 british-crimson-text"></i>
                                        🚇 倫敦大眾交通卡及省錢要領
                                    </h3>
                                    <div className="space-y-3 text-xs text-slate-600 leading-relaxed">
                                        <div className="bg-slate-50 rounded-xl p-3 border border-slate-200">
                                            <strong className="british-navy-text">媽媽 (Contactless 卡支付)</strong><br />
                                            直接使用具感應功能信用卡或 Apple Pay 感應乘車，系統自動依每日乘車上限 (Daily Cap) 進行最優化計費。
                                        </div>
                                        <div className="bg-slate-50 rounded-xl p-3 border border-slate-200">
                                            <strong className="british-crimson-text">哥哥 & 妹妹 (Oyster Card 青年折扣卡)</strong><br />
                                            抵達地鐵站後，於自動售票機為兩位青少年購妥實體 Oyster Card，並立即尋求車站站務人員協助，當場設定 <strong>「Young Visitor Discount (青年半價優惠)」</strong>。設定後，11-15 歲青少年搭乘所有地鐵、電車及巴士均直接享有 <strong>5 折優惠</strong>（效期 14 天）。
                                        </div>
                                    </div>
                                </div>

                                {/* Sunday Trading Law Note */}
                                <div className="bg-white rounded-2xl shadow-md p-5 border border-red-200 bg-red-50/30">
                                    <h3 className="text-sm font-bold british-crimson-text mb-2 flex items-center font-serif">
                                        <i className="fas fa-clock mr-2"></i>
                                        週日營業時間特別限制 (Sunday Trading Act)
                                    </h3>
                                    <p className="text-slate-600 text-xs leading-relaxed">
                                        根據英國《週日營業法》，營業面積大於 280 平方公尺的大型商店與連鎖百貨公司（例如牛津街上的大型 Selfridges 百貨及連鎖大型超市），在<strong>週日當天最多「只」能連續營業 6 小時</strong>（一般時段為 11:30/12:00 開始營業，並在 17:30/18:00 前打烊關閉）。因此，週日的購物與百貨行程必須集中於午後進行。
                                    </p>
                                </div>
                            </div>
                        )}

                        {/* Itinerary Tab */}
                        {activeTab === "itinerary" && (
                            <div className="animate-fade-in pb-8">
                                {/* Horizontal Scroll Days */}
                                <div className="flex overflow-x-auto hide-scrollbar gap-2 mb-4 pb-2 sticky top-[48px] bg-slate-50 pt-2 z-10 border-b border-slate-200">
                                    {itineraryData.map((day, index) => (
                                        <button 
                                            key={index}
                                            onClick={() => handleDaySelect(index)}
                                            className={"flex-shrink-0 px-4 py-2.5 rounded-full text-xs font-bold transition-all " + (selectedDay === index ? 'british-crimson-bg text-white shadow-lg border border-red-500 transform scale-105' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100')}
                                        >
                                            Day {day.day} <span className="text-[10px] opacity-80 block">{day.date.split(' ')[0]}</span>
                                        </button>
                                    ))}
                                </div>

                                {/* Active Day Card */}
                                {currentDayObj && (
                                    <div className="space-y-4">
                                        <div className="bg-white rounded-2xl shadow-md overflow-hidden border border-slate-200">
                                            
                                            {/* Photo Display Card with interactive tab if multiple photos exist */}
                                            {currentDayObj.images && currentDayObj.images.length > 0 ? (
                                                <div className="relative bg-slate-950">
                                                    <div className="h-64 md:h-80 w-full relative bg-slate-900 flex items-center justify-center">
                                                        <img 
                                                            src={currentDayObj.images[currentImgIdx].url} 
                                                            alt={currentDayObj.images[currentImgIdx].title} 
                                                            className="w-full h-full object-cover transition-all duration-300"
                                                            onError={function(e) { e.target.style.display = 'none'; }}
                                                        />
                                                        {/* Soft overlay gradient */}
                                                        <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/25 to-transparent pointer-events-none"></div>
                                                    </div>

                                                    {/* Image selector tabs */}
                                                    <div className="absolute top-3 left-3 right-3 flex gap-2 overflow-x-auto hide-scrollbar z-20">
                                                        {currentDayObj.images.map((img, idx) => (
                                                            <button 
                                                                key={idx}
                                                                onClick={() => switchImage(currentDayObj.day, idx)}
                                                                className={"px-3 py-1 rounded-full text-[10px] font-bold tracking-wide transition-all border whitespace-nowrap backdrop-blur-sm " + (currentImgIdx === idx ? "british-crimson-bg text-white border-red-500 shadow-md" : "bg-black/60 text-slate-300 border-white/10 hover:bg-black/80")}
                                                            >
                                                                {img.title}
                                                            </button>
                                                        ))}
                                                    </div>

                                                    {/* Day title & metadata overlay */}
                                                    <div className="absolute bottom-0 left-0 right-0 p-4 z-10 text-white">
                                                        <div className="flex items-center justify-between mb-1">
                                                            <span className="british-crimson-bg text-white text-[9px] tracking-wider font-extrabold px-2 py-0.5 rounded">
                                                                {currentDayObj.area}
                                                            </span>
                                                            <span className="text-xs text-amber-400 font-extrabold font-mono">
                                                                {currentDayObj.date}
                                                            </span>
                                                        </div>
                                                        <h2 className="text-lg md:text-xl font-bold leading-tight font-serif text-white">
                                                            Day {currentDayObj.day}: {currentDayObj.title}
                                                        </h2>
                                                    </div>
                                                </div>
                                            ) : (
                                                /* Fallback graphic section if no pictures available */
                                                <div className="h-44 relative overflow-hidden">
                                                    <TravelIllustration type={currentDayObj.svgType} />
                                                    <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-black/20 to-transparent z-10 pointer-events-none"></div>
                                                    <div className="absolute bottom-0 left-0 right-0 p-4 z-20 text-white">
                                                        <div className="flex items-center justify-between mb-1">
                                                            <span className="british-crimson-bg text-white text-[9px] tracking-wider font-extrabold px-2 py-0.5 rounded">
                                                                {currentDayObj.area}
                                                            </span>
                                                            <span className="text-xs text-amber-400 font-bold">
                                                                {currentDayObj.date}
                                                            </span>
                                                        </div>
                                                        <h2 className="text-lg font-bold leading-tight font-serif text-white">
                                                            Day {currentDayObj.day}: {currentDayObj.title}
                                                        </h2>
                                                    </div>
                                                </div>
                                            )}
                                            
                                            <div className="p-5">
                                                <p className="text-slate-600 text-sm leading-relaxed mb-4">
                                                    {currentDayObj.highlights}
                                                </p>
                                                
                                                <div className="grid grid-cols-2 gap-2 mb-5">
                                                    <div className="flex items-center text-xs text-slate-700 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                                                        <i className="fas fa-bed british-navy-text w-5 text-center"></i>
                                                        <span className="font-semibold truncate">{currentDayObj.accommodation}</span>
                                                    </div>
                                                    <a href={currentDayObj.mapLink} target="_blank" className="flex items-center text-xs british-navy-text bg-blue-50 p-2.5 rounded-xl border border-blue-100 hover:bg-blue-100 transition font-bold">
                                                        <i className="fas fa-map-marker-alt text-blue-600 w-5 text-center"></i>
                                                        <span>開啟 Google Maps</span>
                                                        <i className="fas fa-external-link-alt ml-auto text-[9px]"></i>
                                                    </a>
                                                </div>

                                                {/* Special Highlight for Day 16 (South Kensington Museums 1-Hour Schedule) */}
                                                {currentDayObj.day === 16 && (
                                                    <div className="bg-slate-50 rounded-2xl p-4 border border-slate-200 mb-5">
                                                        <h4 className="text-xs font-bold british-navy-text mb-3 flex items-center font-serif">
                                                            <span className="text-sm mr-1.5">⏱️</span>
                                                            雙博物館黃金 1 小時特攻路線指南
                                                        </h4>
                                                        <div className="space-y-3">
                                                            <div className="bg-white p-3 rounded-xl border border-slate-200">
                                                                <div className="font-bold text-blue-600 text-xs mb-2 flex items-center">
                                                                    <i className="fas fa-dinosaur mr-1.5"></i> 自然史博物館 一小時重點規劃
                                                                </div>
                                                                <ul className="space-y-1.5 text-[10px] text-slate-600 list-disc pl-4 leading-relaxed">
                                                                    <li><strong className="british-navy-text">00-15 分鐘：</strong>中央大廳 (Hintze Hall) 觀賞巨大懸吊藍鯨骨骼標本 Hope。</li>
                                                                    <li><strong>15-40 分鐘：</strong>恐龍廳 (Dinosaurs Gallery) 直接前往會動的機械暴龍 T. rex 核心區。</li>
                                                                    <li><strong>40-55 分鐘：</strong>地球廳 (Earth Hall) 觀看極為完整的劍龍化石 Sophie。</li>
                                                                    <li><strong>55-60 分鐘：</strong>出口處與梁龍 Fern 銅像合影後前往 V&A。</li>
                                                                </ul>
                                                            </div>
                                                            <div className="bg-white p-3 rounded-xl border border-slate-200">
                                                                <div className="font-bold text-rose-600 text-xs mb-2 flex items-center">
                                                                    <i className="fas fa-gem mr-1.5"></i> V&A 藝術與設計博物館 一小時重點規劃
                                                                </div>
                                                                <ul className="space-y-1.5 text-[10px] text-slate-600 list-disc pl-4 leading-relaxed">
                                                                    <li><strong>00-15 分鐘：</strong>石膏模型廳 (Cast Courts) 欣賞特拉揚柱與米開朗基羅大衛像複製品。</li>
                                                                    <li><strong>15-35 分鐘：</strong>英國藝廊 (British Galleries) 觀賞華麗家具、皇室金銀珠寶工藝。</li>
                                                                    <li><strong>35-50 分鐘：</strong>服裝展廳 (Fashion Gallery) 瀏覽歐洲歷代經典時尚與服飾演變。</li>
                                                                    <li><strong>50-60 分鐘：</strong>進入 V&A Café (世界第一座博物館咖啡廳) 觀賞奢華的室內裝飾。</li>
                                                                </ul>
                                                            </div>
                                                        </div>
                                                    </div>
                                                )}

                                                {/* History Section */}
                                                <div className="bg-slate-50 rounded-2xl p-4 border border-slate-200 mb-5">
                                                    <h4 className="text-xs font-bold british-navy-text mb-2 flex items-center font-serif">
                                                        <span className="text-sm mr-1.5">📖</span>
                                                        {currentDayObj.historyTitle}
                                                    </h4>
                                                    <p className="text-xs text-slate-600 leading-relaxed">
                                                        {currentDayObj.historyIntro}
                                                    </p>
                                                </div>

                                                <h3 className="font-bold text-slate-800 text-xs mb-3 border-b border-slate-200 pb-2 flex items-center">
                                                    <i className="far fa-clock british-navy-text mr-2"></i>今日行程詳細明細
                                                </h3>
                                                <div className="relative border-l-2 border-slate-200 ml-3 space-y-4 pl-4">
                                                    {currentDayObj.timeline.map((item, i) => {
                                                        const icons = {
                                                            transport: "fa-car-side text-blue-600 bg-blue-50",
                                                            activity: "fa-camera text-emerald-600 bg-emerald-50",
                                                            food: "fa-utensils text-amber-600 bg-amber-50",
                                                            alert: "fa-exclamation-triangle text-red-600 bg-red-50"
                                                        };
                                                        return (
                                                            <div key={i} className="relative">
                                                                <div className="absolute -left-[24px] top-0.5 bg-white rounded-full p-0.5">
                                                                    <div className="border border-slate-200 rounded-full w-5 h-5 flex items-center justify-center">
                                                                        <i className={"fas " + icons[item.type].split(' ')[0] + " text-[9px] " + icons[item.type].split(' ')[1]}></i>
                                                                    </div>
                                                                </div>
                                                                <div className="text-[10px] font-bold text-slate-400 mb-0.5">{item.time}</div>
                                                                <div className="text-xs text-slate-700 font-medium leading-relaxed">{item.event}</div>
                                                            </div>
                                                        )
                                                    })}
                                                </div>
                                            </div>
                                        </div>

                                        {/* Sibling Mission Card - Deep British Navy Blue for High Contrast Accent */}
                                        {currentDayObj.mission && (
                                            <div className="british-navy-bg text-white rounded-2xl shadow-lg p-5 border border-slate-800 relative overflow-hidden">
                                                <div className="absolute top-0 right-0 opacity-10 text-6xl m-[-10px] text-white pointer-events-none">
                                                    <i className="fas fa-user-secret"></i>
                                                </div>
                                                <div className="relative z-10">
                                                    <div className="flex justify-between items-center mb-3 border-b border-blue-900 pb-2">
                                                        <h3 className="font-bold text-sm flex items-center text-amber-400">
                                                            <i className="fas fa-unlock-alt mr-2"></i> 
                                                            {currentDayObj.mission.title}
                                                        </h3>
                                                        <span className="text-[9px] font-bold bg-amber-500 text-slate-950 px-2 py-0.5 rounded-full uppercase tracking-wider">
                                                            特工現場任務
                                                        </span>
                                                    </div>
                                                    <p className="text-xs text-blue-200 mb-4 leading-relaxed">
                                                        特工專屬任務。在旅途中偕同哥哥、妹妹，於現場達成以下目標，手動點擊核取方塊完成回報：
                                                    </p>
                                                    
                                                    <div className="space-y-3">
                                                        {currentDayObj.mission.items.map((item, idx) => {
                                                            const key = currentDayObj.day + "-" + idx;
                                                            const isChecked = !!completedMissions[key];
                                                            return (
                                                                <div 
                                                                    key={idx}
                                                                    onClick={() => toggleMissionItem(currentDayObj.day, idx)}
                                                                    className={"flex items-start gap-3 p-3 rounded-xl border cursor-pointer transition-all " + (isChecked ? 'bg-emerald-950/40 border-emerald-500/50 text-emerald-100' : 'bg-slate-900/40 border-slate-700/50 hover:bg-slate-900/60 text-slate-100')}
                                                                >
                                                                    <div className="mt-0.5">
                                                                        {isChecked ? (
                                                                            <i className="fas fa-check-circle text-emerald-400 text-sm"></i>
                                                                        ) : (
                                                                            <i className="far fa-circle text-slate-500 text-sm"></i>
                                                                        )}
                                                                    </div>
                                                                    <span className="text-xs leading-relaxed">{item}</span>
                                                                </div>
                                                            )
                                                        })}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Custom Modal for Completing Missions - Light Themed Elegant styling */}
                    {modalContent && (
                        <div className="fixed inset-0 bg-black/55 flex items-center justify-center p-4 z-50 animate-fade-in">
                            <div className="bg-white text-slate-800 rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 animate-pop">
                                <div className="text-center mb-4">
                                    <div className="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl mb-3 border border-emerald-100">
                                        <i className="fas fa-medal"></i>
                                    </div>
                                    <h3 className="text-lg font-bold british-navy-text font-serif">{modalContent.title}</h3>
                                    <p className="text-xs text-slate-500 mt-1">{modalContent.text}</p>
                                </div>
                                <div className="bg-slate-50 rounded-2xl p-4 border border-slate-200 mb-5 text-left">
                                    <div className="text-xs font-bold british-navy-text flex items-center mb-2">
                                        <i className="fas fa-info-circle mr-1.5 british-crimson-text"></i>
                                        景點趣味背景冷知識
                                    </div>
                                    <p className="text-xs text-slate-600 leading-relaxed">
                                        {modalContent.bonus}
                                    </p>
                                </div>
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => setModalContent(null)}
                                        className="w-full py-3 british-crimson-bg hover:bg-red-800 text-white rounded-full text-xs font-bold transition shadow-md border border-red-500"
                                    >
                                        解鎖完成 · 繼續旅程
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
